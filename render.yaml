services:
  - type: web
    name: zaouia-web
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zaouia-db
          property: connectionString
      - key: USE_REDIS
        value: "false"
      - key: RUN_MIGRATIONS
        value: "1"
      - key: STORAGE_BACKEND
        value: local

databases:
  - name: zaouia-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
    databaseName: zaouia
    user: zaouia
    ipAllowList: []
