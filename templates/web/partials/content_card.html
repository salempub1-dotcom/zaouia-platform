<article class="content-card"><a class="card-media" href="{% url 'web:content_detail' item.slug %}">{% if item.thumbnail_url %}<img src="{{ item.thumbnail_url }}" alt="" loading="lazy">{% else %}<span class="placeholder">✦</span>{% endif %}<span class="type-badge">{{ item.get_content_type_display }}</span>{% if item.duration %}<span class="duration">{{ item.duration }}</span>{% endif %}</a><div class="card-body"><h3><a href="{% url 'web:content_detail' item.slug %}">{{ item.title }}</a></h3>{% if item.scholar %}<p class="muted">{{ item.scholar }}</p>{% endif %}<div class="meta"><span>◉ {{ item.views_count }}</span><time>{{ item.published_at|date:'Y/m/d' }}</time></div></div></article>
